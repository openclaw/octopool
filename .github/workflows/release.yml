name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release or rehearse
        required: true
        type: string
      dry_run:
        description: Build, sign, notarize and verify without publishing
        default: true
        type: boolean

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { requireReleasePreflight } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/require-release-preflight.mjs`);
            const run = await requireReleasePreflight({ github, context,
              version: process.env.RELEASE_VERSION, dryRun: process.env.DRY_RUN === 'true' });
            core.info(`Verified manual release preflight ${run}`);
  release:
    needs: preflight
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@v1
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      repository-type: openclaw
      homebrew-tap: openclaw/homebrew-tap
      homebrew-formula: octopool
      archive-files: '["LICENSE","README.md"]'
      checksum-filename: checksums.txt
      nfpm: disabled
      stable-identifier: org.openclaw.octopool
      darwin-universal: disabled
      ci-check-events: '["push"]'
      strict-checks: true
      reproducible-rebuild: non-darwin
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
