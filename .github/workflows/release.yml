name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${DISPATCH_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "::error::could not resolve release tag"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release ref must be a version tag like v0.1.0, got $tag"
            exit 1
          fi
          if ! commit="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            echo "::error::release ref must resolve to an existing tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      - name: Check out release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git checkout --detach "refs/tags/$RELEASE_TAG"
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "::error::checked out commit does not match $RELEASE_TAG"
            exit 1
          fi

      - name: Stash GoReleaser config
        run: cp .goreleaser.yaml /tmp/.goreleaser.yaml

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.16.0"
          args: release --clean --config /tmp/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish changelog release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="$(awk -v version="$RELEASE_VERSION" '
            $1 == "##" && $2 == version { in_section = 1 }
            in_section && $1 == "##" && $2 != version { exit }
            in_section { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $RELEASE_VERSION"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --notes "$notes"
          body="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          if ! grep -q "^## $RELEASE_VERSION" <<<"$body"; then
            echo "::error::GitHub release $RELEASE_TAG does not contain the $RELEASE_VERSION changelog"
            exit 1
          fi
